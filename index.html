<!doctype html>
<!--
  Nexus scanner Mini App (ADR-0006).
  Instance-agnostic: it reads QR codes with Telegram's native scanner and hands
  the raw text back to the bot that opened it, through Telegram.WebApp.sendData.
  It stores nothing, calls no server and knows nothing about receipts, so one
  hosted copy serves every Nexus instance and every country.

  Flow: each read closes the scanner and shows a confirmation, so the owner
  always knows a code was taken. Codes are sent with Telegram's main button.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #6b6b6b);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --surface: var(--tg-theme-secondary-bg-color, #f2f2f5);
      --ok: #2e9d57;
      --warn: #c98a00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px; min-height: 100vh;
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; gap: 16px;
    }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: var(--hint); }
    [hidden] { display: none !important; }
    .status {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 28px 16px; border-radius: 14px; background: var(--surface); text-align: center;
    }
    .mark {
      width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
      font-size: 34px; font-weight: 700; color: #ffffff; background: var(--ok);
    }
    .status.repeat .mark { background: var(--warn); }
    .status strong { font-size: 18px; }
    .status.fresh { animation: pop 0.25s ease-out; }
    @keyframes pop { from { transform: scale(0.94); opacity: 0.4; } to { transform: none; opacity: 1; } }
    button {
      border: 0; border-radius: 10px; padding: 14px; font: inherit; font-weight: 600;
      background: var(--button); color: var(--button-text);
    }
    button.secondary { background: var(--surface); color: var(--text); }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="hint"></p>
  <div id="status" class="status" hidden>
    <div class="mark" id="mark">✓</div>
    <strong id="statusTitle"></strong>
    <p id="statusCount"></p>
  </div>
  <button id="scan" type="button"></button>
  <script>
    "use strict";
    const PAYLOAD_VERSION = 1;
    const MAX_BYTES = 4000; // Telegram caps sendData at 4096 bytes.

    const TEXT = {
      pt: {
        title: "Escanear notas", hint: "Aponte a câmera para o QR da nota.",
        scan: "Abrir leitor", again: "Ler outra nota", popup: "Aponte para o QR da nota",
        read: "Nota lida", repeat: "Essa nota já foi lida", full: "Limite atingido, envie estas primeiro",
        count: (n) => (n === 1 ? "1 nota pronta para enviar" : `${n} notas prontas para enviar`),
        send: (n) => (n === 1 ? "Enviar 1 nota" : `Enviar ${n} notas`),
        unsupported: "Atualize o Telegram para usar o leitor de QR.",
      },
      es: {
        title: "Escanear comprobantes", hint: "Apunta la cámara al QR del comprobante.",
        scan: "Abrir lector", again: "Leer otro comprobante", popup: "Apunta al QR del comprobante",
        read: "Comprobante leído", repeat: "Este comprobante ya fue leído", full: "Límite alcanzado, envía estos primero",
        count: (n) => (n === 1 ? "1 comprobante listo para enviar" : `${n} comprobantes listos para enviar`),
        send: (n) => (n === 1 ? "Enviar 1 comprobante" : `Enviar ${n} comprobantes`),
        unsupported: "Actualiza Telegram para usar el lector de QR.",
      },
      en: {
        title: "Scan receipts", hint: "Point the camera at the receipt QR code.",
        scan: "Open scanner", again: "Scan another receipt", popup: "Point at the receipt QR code",
        read: "Receipt read", repeat: "This receipt was already read", full: "Limit reached, send these first",
        count: (n) => (n === 1 ? "1 receipt ready to send" : `${n} receipts ready to send`),
        send: (n) => (n === 1 ? "Send 1 receipt" : `Send ${n} receipts`),
        unsupported: "Update Telegram to use the QR scanner.",
      },
    };

    const app = window.Telegram && window.Telegram.WebApp;
    const user = app && app.initDataUnsafe && app.initDataUnsafe.user;
    const lang = ((user && user.language_code) || navigator.language || "en").slice(0, 2);
    const t = TEXT[lang] || TEXT.en;
    document.documentElement.lang = lang;

    const $ = (id) => document.getElementById(id);
    $("title").textContent = t.title;
    $("hint").textContent = t.hint;
    $("scan").textContent = t.scan;

    const codes = new Set();

    function encoded(list) {
      return JSON.stringify({ v: PAYLOAD_VERSION, codes: list });
    }

    function show(kind) {
      const status = $("status");
      status.hidden = false;
      status.classList.toggle("repeat", kind !== "read");
      status.classList.remove("fresh");
      void status.offsetWidth; // restart the animation on every read
      status.classList.add("fresh");
      $("mark").textContent = kind === "read" ? "✓" : "!";
      $("statusTitle").textContent = t[kind];
      $("statusCount").textContent = t.count(codes.size);
      $("scan").textContent = t.again;
      $("scan").className = "secondary";
      app.MainButton.setText(t.send(codes.size));
      app.MainButton.show();
      app.enableClosingConfirmation(); // unsent codes would be lost
    }

    function onCode(text) {
      const code = (text || "").trim();
      if (!code) return false;
      if (codes.has(code)) {
        app.HapticFeedback.notificationOccurred("warning");
        show("repeat");
      } else if (new TextEncoder().encode(encoded([...codes, code])).length > MAX_BYTES) {
        app.HapticFeedback.notificationOccurred("error");
        show("full");
      } else {
        codes.add(code);
        app.HapticFeedback.notificationOccurred("success");
        show("read");
      }
      return true; // close the scanner so the confirmation is visible
    }

    function scan() {
      app.showScanQrPopup({ text: t.popup }, onCode);
    }

    function send() {
      if (!codes.size) return;
      app.disableClosingConfirmation();
      app.sendData(encoded([...codes]));
    }

    if (!app || !app.isVersionAtLeast("6.4")) {
      $("hint").textContent = t.unsupported;
      $("scan").hidden = true;
    } else {
      app.ready();
      app.expand();
      app.MainButton.onClick(send);
      $("scan").addEventListener("click", scan);
      scan();
    }
  </script>
</body>
</html>
